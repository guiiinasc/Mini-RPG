<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura: Reino Perdido</title>
    <!-- Fontes com cara de jogo antigo (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div class="jogo">
        <h1 class="titulo">Aventura:<br>Reino Perdido</h1>

        <!-- TELA INICIAL (pede o nome do jogador) -->
        <div id="telaInicio" class="caixa-texto">
            <p class="texto">Qual é o seu nome, aventureiro?</p>
            <input id="campoNome" type="text" maxlength="15" placeholder="Digite seu nome">
            <div class="opcoes">
                <button id="btnComecar">Começar ▶</button>
            </div>
        </div>

        <!-- TELA DE BATALHA -->
        <div id="telaBatalha" class="campo-batalha" hidden>

            <!-- INIMIGO -->
            <div class="personagem inimigo">
                <div class="imagem-personagem" id="imagemInimigo">
                    <img id="fotoInimigo" src="" alt="Imagem do inimigo">
                </div>
                <div class="status-batalha">
                    <h2 id="nomeInimigo"></h2>
                    <p>
                        <span class="rotulo">HP</span>
                        <span id="vidaInimigo"></span>/<span id="vidaMaximaInimigo"></span>
                    </p>
                    <div class="barra-vida">
                        <div id="barraVidaInimigo" class="barraVida"></div>
                    </div>
                </div>
            </div>

            <!-- JOGADOR -->
            <div class="personagem jogador">
                <div class="imagem-personagem" id="imagemJogador">
                    <img id="fotoJogador" src="img/jogador.svg" alt="Imagem do jogador">
                </div>
                <div class="status-batalha">
                    <h2 id="playerName">Aventureiro</h2>
                    <p>
                        <span class="rotulo">HP</span>
                        <span id="vidaJogador">100</span>/100
                    </p>
                    <div class="barra-vida">
                        <div id="barraVidaJogador" class="barraVida"></div>
                    </div>
                    <p>
                        <span class="rotulo">FÚRIA</span>
                        <span id="furiaJogador">0</span>/50
                    </p>
                    <div class="barra-furia">
                        <div id="barraFuriaJogador" class="barraFuria"></div>
                    </div>
                    <p>
                        <span class="rotulo">POÇÕES</span>
                        <span id="pocoesJogador">2</span>
                    </p>
                </div>
            </div>

        </div>

        <!-- CAIXA DE TEXTO (história e mensagens da batalha) -->
        <div id="caixaTexto" class="caixa-texto" hidden>
            <p id="texto" class="texto"></p>
            <div id="opcoes" class="opcoes"></div>
        </div>

        <!-- AÇÕES DA BATALHA -->
        <div id="acoesBatalha" class="acoes-batalha" hidden>
            <button id="btnAtacar">Atacar</button>
            <button id="btnPoder">Fúria</button>
            <button id="btnPocao">Poção</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
